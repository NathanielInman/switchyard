[package]
name = "yard"
description = "Switchyard daemon, CLI and waybar module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
yard-core = { path = "../yard-core" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry"] }
