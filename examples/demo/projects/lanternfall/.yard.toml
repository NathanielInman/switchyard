[task.lanternfall]
description = "Boot.tscn"
tags = ["games"]
pin = 1
heavy = true
mem = "12G"
steps = [
  { name = "dotnet build", cmd = "fake-build 6" },
  { name = "import", cmd = "fake-build 3" },
]
run = "fake-game lanternfall"
errors = ["csharp", "godot"]

[task.lanternfall.retry]
step = 2
on = "signal"
attempts = 3

[[task.lanternfall.watch]]
match = '^(USER )?(SCRIPT )?ERROR:'
title = "runtime error"
urgency = "critical"

[task.proving]
label = "proving"
description = "Workbench.tscn"
tags = ["games"]
pin = 5
steps = ["fake-build 2"]
run = "fake-game proving"

[task.waypoint]
description = "NavTest.tscn"
tags = ["games"]
pin = 6
steps = ["fake-build 2"]
run = "fake-game waypoint"
