[workspace]
resolver = "2"
members = ["crates/yard-core", "crates/yard", "crates/yard-board", "crates/yard-tray"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NathanielInman/switchyard"
authors = ["Nathaniel Inman"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
anyhow = "1"
glob = "0.3"
libc = "0.2"

# GTK and egui callbacks live in RefCell<Option<Rc<dyn Fn(..)>>> fields;
# naming each one would hide the shape, not simplify it.
[workspace.lints.clippy]
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
