name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, pkgs: "-p yard -p yard-board", bins: "yard yard-board" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, pkgs: "-p yard -p yard-board", bins: "yard yard-board" }
          - { os: macos-latest, target: aarch64-apple-darwin, pkgs: "-p yard -p yard-tray", bins: "yard yard-tray" }
          - { os: macos-latest, target: x86_64-apple-darwin, pkgs: "-p yard -p yard-tray", bins: "yard yard-tray" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkgs: "-p yard -p yard-tray", bins: "yard.exe yard-tray.exe" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: .github/scripts/gtk4-layer-shell.sh
      - name: Build
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/aarch64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.pkgs }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          for b in ${{ matrix.bins }}; do cp "target/${{ matrix.target }}/release/$b" dist/; done
          cp README.md LICENSE dist/
          name="switchyard-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a "../$name.zip" .)
          else
            tar -czf "$name.tar.gz" -C dist .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: switchyard-${{ matrix.target }}
          path: switchyard-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum switchyard-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Switchyard ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
      - name: Update the Homebrew formula, Scoop manifest and AUR PKGBUILD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum() { grep " $1\$" artifacts/SHA256SUMS | cut -d' ' -f1; }
          src_sha=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | sha256sum | cut -d' ' -f1)
          python3 packaging/render.py "$version" \
            "$(sum switchyard-aarch64-apple-darwin.tar.gz)" \
            "$(sum switchyard-x86_64-apple-darwin.tar.gz)" \
            "$(sum switchyard-x86_64-unknown-linux-gnu.tar.gz)" \
            "$(sum switchyard-aarch64-unknown-linux-gnu.tar.gz)" \
            "$(sum switchyard-x86_64-pc-windows-msvc.zip)" \
            "$src_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula bucket packaging/aur
          git commit -m "chore(release): update package manifests for $GITHUB_REF_NAME" || exit 0
          git push origin main
